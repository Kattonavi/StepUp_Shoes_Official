<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default Open Graph / social-share image for StepUp.
  Dimensions: 1200x630 (Facebook/X recommended).
  TODO: replace with a real PNG with photography when a designer ships one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#F26A21" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F26A21" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F26A21" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#17171b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="80" y="180" width="6" height="60" fill="#F26A21" rx="3"/>

  <!-- eyebrow -->
  <text x="110" y="222"
        font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="700"
        letter-spacing="6"
        fill="#F26A21">
    NUEVA COLECCIÓN
  </text>

  <!-- title -->
  <text x="80" y="340"
        font-family="Inter, system-ui, sans-serif"
        font-size="130" font-weight="900"
        letter-spacing="-3"
        fill="#F2EBD9">
    Nómada
  </text>

  <!-- subtitle -->
  <text x="80" y="410"
        font-family="Inter, system-ui, sans-serif"
        font-size="38" font-weight="600"
        fill="#A8A8AD">
    Ropa, zapatos y accesorios
  </text>

  <!-- bottom row -->
  <text x="80" y="540"
        font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="500"
        fill="#7a7a82">
    Consulta disponibilidad por WhatsApp
  </text>

  <!-- right side accent strip -->
  <rect x="1080" y="0" width="6" height="630" fill="#F26A21" fill-opacity="0.8"/>
</svg>
