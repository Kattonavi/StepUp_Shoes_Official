<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local hero illustration for /. Stylized sneaker side-profile that matches
  the dark + orange brand palette. Lightweight, no external dependency.
  Replace with a real product photo by dropping a /public/hero-shoe.jpg (or
  .webp) and pointing HomeHero at that path.
-->
<svg
  viewBox="0 0 800 600"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Sneaker premium Nómada"
>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#F26A21" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#F26A21" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="55%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#F26A21" />
    </linearGradient>
    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <!-- backdrop warm glow -->
  <ellipse cx="400" cy="320" rx="400" ry="240" fill="url(#bgGlow)" />

  <!-- decorative concentric rings -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="#F26A21" stroke-width="1" opacity="0.06" />
  <circle cx="400" cy="300" r="220" fill="none" stroke="#F26A21" stroke-width="1" opacity="0.1" />

  <!-- ground shadow -->
  <ellipse cx="400" cy="478" rx="260" ry="14" fill="#000000" opacity="0.55" />
  <ellipse cx="400" cy="482" rx="220" ry="7" fill="#000000" opacity="0.35" />

  <!-- shoe (side profile, facing right) -->
  <g transform="translate(140 220)">
    <!-- sole bottom -->
    <path
      d="M 0 210 Q 0 250 60 250 L 470 250 Q 520 250 520 220 L 510 200 L 5 200 Z"
      fill="url(#soleGrad)"
    />
    <!-- sole highlight stripe -->
    <path d="M 10 213 L 510 213" stroke="#52525b" stroke-width="2" opacity="0.55" />

    <!-- upper body -->
    <path
      d="M 5 200 Q 20 170 65 145 L 130 110 Q 175 85 235 85 L 380 85 Q 430 90 470 130 L 510 200 Z"
      fill="url(#bodyGrad)"
    />

    <!-- toe-box highlight -->
    <path
      d="M 430 95 Q 470 110 500 165"
      stroke="#ffffff"
      stroke-width="3"
      opacity="0.55"
      fill="none"
    />

    <!-- collar / heel cup -->
    <path
      d="M 5 200 Q 12 175 50 162 L 95 162 Q 112 200 100 215 Q 60 215 30 215 Q 12 215 5 200 Z"
      fill="url(#collarGrad)"
    />

    <!-- tongue -->
    <path
      d="M 175 100 Q 220 90 270 95 L 285 165 Q 235 170 185 165 Z"
      fill="#fafafa"
      stroke="#a1a1aa"
      stroke-width="1.5"
    />

    <!-- laces -->
    <g stroke="#27272a" stroke-width="3" stroke-linecap="round">
      <line x1="195" y1="115" x2="275" y2="118" />
      <line x1="195" y1="128" x2="275" y2="131" />
      <line x1="195" y1="141" x2="275" y2="144" />
      <line x1="195" y1="154" x2="275" y2="157" />
    </g>

    <!-- accent swoosh -->
    <path
      d="M 140 170 Q 260 130 400 155 L 460 175"
      stroke="url(#swoosh)"
      stroke-width="22"
      stroke-linecap="round"
      fill="none"
    />
    <!-- swoosh highlight -->
    <path
      d="M 160 168 Q 270 132 395 153"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
      opacity="0.4"
    />

    <!-- brand dot on heel -->
    <circle cx="60" cy="180" r="8" fill="#F26A21" />
    <circle cx="60" cy="180" r="3" fill="#ffffff" opacity="0.85" />

    <!-- stitching detail -->
    <path
      d="M 90 165 L 470 175"
      stroke="#71717a"
      stroke-width="1"
      stroke-dasharray="3 4"
      opacity="0.55"
    />

    <!-- heel pull tab -->
    <rect x="6" y="158" width="22" height="14" rx="3" fill="#F26A21" opacity="0.85" />
  </g>
</svg>
