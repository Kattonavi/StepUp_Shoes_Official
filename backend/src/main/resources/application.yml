spring:
  application:
    name: stepup-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource — sobreescrito por perfil
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stepup_dev}
    username: ${DB_USER:stepup}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # Flyway — configurado en com.stepup.config.FlywayConfig (Spring Boot 4 no incluye FlywayAutoConfiguration).
  # baseline-on-migrate leído por FlywayConfig vía @Value("${spring.flyway.baseline-on-migrate:false}").
  flyway:
    baseline-on-migrate: false

server:
  # PORT is the Railway convention; SERVER_PORT is the legacy local dev var; 8080 is the default
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

# App properties
app:
  version: "0.1.0"
  environment: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-this-in-production-must-be-at-least-64-chars-long}
      access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    # Cookies httpOnly de sesión (access/refresh).
    # Cross-site (frontend y backend en dominios distintos, p.ej. Railway):
    #   SESSION_COOKIE_SECURE=true  SESSION_COOKIE_SAME_SITE=None
    # Local (http://localhost): secure=false, same-site=Lax (ver application-dev.yml).
    # SameSite=None EXIGE Secure=true; el navegador descarta None sin Secure.
    cookie:
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: ${SESSION_COOKIE_SAME_SITE:None}
      domain: ${SESSION_COOKIE_DOMAIN:}
      access-name: ${SESSION_COOKIE_ACCESS_NAME:access_token}
      refresh-name: ${SESSION_COOKIE_REFRESH_NAME:refresh_token}
      path: ${SESSION_COOKIE_PATH:/}
    # Scheduled cleanup for the refresh_tokens table.
    # cleanup-enabled=false disables the @Scheduled job (table will grow).
    # retention-days controls how old expired/revoked rows must be before deletion.
    # cleanup-cron is a Spring cron expression evaluated in UTC.
    refresh-token:
      cleanup-enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:true}
      retention-days: ${REFRESH_TOKEN_RETENTION_DAYS:30}
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 15 3 * * *}
    # CORS_ALLOWED_ORIGINS tiene prioridad (nombre usado en Railway).
    # ALLOWED_ORIGINS es el fallback para compatibilidad y desarrollo local.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:3000}}

  # In-memory anti-abuse limiter (Fase D). Keys are scoped per endpoint family.
  # Login uses ipHash + emailHash; contact uses ipHash; analytics uses ipHash + sessionId.
  # Disable globally with RATE_LIMIT_ENABLED=false. Limitation: state is per-process —
  # does not share across multiple Railway replicas.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      max-attempts:   ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${RATE_LIMIT_LOGIN_WINDOW_MINUTES:15}
    login-email:
      max-attempts:   ${RATE_LIMIT_LOGIN_EMAIL_MAX_ATTEMPTS:20}
      window-minutes: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW_MINUTES:60}
    contact:
      max-attempts:   ${RATE_LIMIT_CONTACT_MAX_ATTEMPTS:5}
      window-minutes: ${RATE_LIMIT_CONTACT_WINDOW_MINUTES:10}
    analytics:
      max-attempts:   ${RATE_LIMIT_ANALYTICS_MAX_ATTEMPTS:120}
      window-minutes: ${RATE_LIMIT_ANALYTICS_WINDOW_MINUTES:10}

  # Cloudinary — sign + destroy ahora se hacen desde el backend para que
  # funcionen con la sesión en cookies httpOnly (frontend y backend en dominios
  # distintos). El API secret JAMÁS se expone al cliente.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key:    ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    products-folder:   ${CLOUDINARY_UPLOAD_FOLDER:stepup/products}
    promotions-folder: ${CLOUDINARY_PROMOTIONS_FOLDER:stepup/promotions}

  super-admin:
    email: ${SUPER_ADMIN_EMAIL:superadmin@stepup.local}
    password: ${SUPER_ADMIN_PASSWORD:changeme}
    full-name: ${SUPER_ADMIN_FULL_NAME:Super Admin}
    reset-password: ${SUPER_ADMIN_RESET_PASSWORD:false}

logging:
  level:
    root: INFO
    com.stepup: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
