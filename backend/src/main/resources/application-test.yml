# Configuración de tests — usa Testcontainers para PostgreSQL real
# La URL de datasource se sobreescribe dinámicamente por Testcontainers.

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///stepup_test?TC_REUSABLE=true
    username: stepup
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    root: WARN
    com.stepup: DEBUG
    org.testcontainers: INFO
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
