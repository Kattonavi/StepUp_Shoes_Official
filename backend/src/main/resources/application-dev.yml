spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stepup_dev}
    username: ${DB_USER:stepup}
    password: ${DB_PASSWORD:changeme}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    out-of-order: false

# Local dev: cookies sobre http://localhost. Secure=true rompería las cookies,
# y SameSite=None exige Secure, así que usamos Lax. Frontend y backend comparten
# el mismo sitio (localhost) salvo el puerto, y Lax funciona para ese caso.
app:
  security:
    cookie:
      secure: ${SESSION_COOKIE_SECURE:false}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

logging:
  level:
    root: INFO
    com.stepup: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
