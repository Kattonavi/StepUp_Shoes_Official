# Configuración de producción — Railway
# Las variables sensibles vienen de las variables de entorno de Railway.

spring:
  datasource:
    # Railway provee DATABASE_URL en formato: postgresql://user:pass@host:port/db
    # Spring Boot 4 puede leerlo directamente o usar la forma explícita:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.stepup: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
