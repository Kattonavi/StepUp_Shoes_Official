# ============================================================
# StepUp Backend — Perfil de producción (Railway)
# Activa con: SPRING_PROFILES_ACTIVE=prod
#
# Variables de entorno REQUERIDAS en Railway:
#   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD  ← del plugin PostgreSQL
#   JWT_SECRET
#   ALLOWED_ORIGINS
#   SUPER_ADMIN_EMAIL, SUPER_ADMIN_PASSWORD, SUPER_ADMIN_FULL_NAME
#
# NOTA: Railway expone DATABASE_URL en formato postgresql:// (sin prefijo jdbc:).
#   El driver JDBC necesita jdbc:postgresql://, por eso se construye la URL
#   directamente desde PGHOST/PGPORT/PGDATABASE.
#   Override opcional: DATABASE_URL_JDBC=jdbc:postgresql://host:port/db
# ============================================================

spring:
  datasource:
    # Construido desde variables PG* que Railway provee automáticamente.
    # Override manual posible con DATABASE_URL_JDBC (formato jdbc:postgresql://).
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
    username: ${DATABASE_USERNAME:${PGUSER}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # Valor normal en producción: validate
      # Diagnóstico (temporal): none — permite arrancar sin validar esquema
      # Configurar HIBERNATE_DDL_AUTO=none en Railway UI solo para diagnosticar;
      # volver a validate una vez confirmado que Flyway corrió y las tablas existen.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    # false para bases nuevas (Railway primer deploy).
    # Setear FLYWAY_BASELINE_ON_MIGRATE=true SOLO si la DB ya tiene tablas
    # creadas fuera de Flyway y se quiere hacer baseline manual.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    # Protección: nunca borrar el esquema en producción
    clean-disabled: true
    # Las migraciones deben aplicarse siempre en orden ascendente
    out-of-order: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  # Compresión HTTP para reducir transferencia
  compression:
    enabled: true
    min-response-size: 1024

# Desactivar Swagger/API docs en producción
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.stepup: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: WARN
    # Flyway — ver en logs qué migraciones se aplican y en qué orden
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    # Hibernate schema validation — ver qué tabla falta si hay error
    org.hibernate.tool.schema: INFO
